<!DOCTYPE html>
<html>
<head>
    <title>History</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            padding:20px;
        }

        h1{
            text-align:center;
            color:#4CAF50;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            margin-top:20px;
        }

        th,td{
            border:1px solid #ddd;
            padding:10px;
            text-align:left;
        }

        th{
            background:#4CAF50;
            color:white;
        }

        tr:nth-child(even){
            background:#f2f2f2;
        }
    </style>
</head>

<body>

<h1>Report History</h1>

<table>
<thead>
<tr>
<th>Name</th>
<th>Issue Type</th>
<th>Description</th>
<th>Date</th>
</tr>
</thead>

<tbody id="historyTable"></tbody>

</table>

<script type="module">

import { db } from "./firebase.js";

import {
collection,
getDocs,
query,
orderBy
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const table=document.getElementById("historyTable");

const q=query(collection(db,"reports"),orderBy("createdAt","desc"));

const snapshot=await getDocs(q);

snapshot.forEach((doc)=>{

const data=doc.data();

const row=`
<tr>
<td>${data.name}</td>
<td>${data.issueType}</td>
<td>${data.description}</td>
<td>${data.createdAt ? data.createdAt.toDate().toLocaleString() : ""}</td>
</tr>
`;

table.innerHTML+=row;

});

</script>

</body>
</html>
